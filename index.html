<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delim Lizard</title>
    <link rel="icon" type="image/png" href="assets/apple-icon.png?v=20260709-1801">
    <link rel="apple-touch-icon" href="assets/apple-icon.png?v=20260709-1801">
    <link rel="stylesheet" href="styles.css?v=20260709-1801">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="brand-lockup">
          <img src="assets/yelling-lizard-logo.png?v=20260709-1801" alt="" class="brand-logo" width="72" height="72">
          <div>
            <p class="eyebrow">List and delimiter builder</p>
            <h1>Delim Lizard</h1>
          </div>
        </div>
        <div class="action-bar" aria-label="List actions">
          <details class="tools-menu" data-current-tool="delim-lizard">
            <summary>Tools</summary>
            <div class="tools-menu-list">
              <a href="https://www.davidbreyer.com/tools/">All Tools</a>
              <a href="https://www.davidbreyer.com/format-lizard/">Format Lizard</a>
              <a href="https://www.davidbreyer.com/compare-lizard/">Compare Lizard</a>
              <a href="https://www.davidbreyer.com/mock-lizard/">Mock Lizard</a>
              <a href="https://www.davidbreyer.com/duplicate-lizard/">Duplicate Lizard</a>
              <a href="https://www.davidbreyer.com/datetime-lizard/">DateTime Lizard</a>
              <a href="https://www.davidbreyer.com/delim-lizard/" aria-current="page">Delim Lizard</a>
            </div>
          </details>
          <button id="openButton" type="button">Open</button>
          <button id="copyButton" type="button" class="primary-button">Copy</button>
          <button id="saveButton" type="button">Save</button>
          <button id="clearButton" type="button" class="ghost-button">Clear</button>
          <input id="fileInput" class="file-input" type="file" accept=".txt,.csv,.tsv,text/plain,text/csv,text/tab-separated-values">
        </div>
      </header>

      <section class="control-panel" aria-label="Delimiter controls">
        <div class="control-group preset-group">
          <label class="control-group-title" for="preset">Preset</label>
          <select id="preset">
            <option value="custom">Custom</option>
            <option value="sql">SQL IN</option>
            <option value="csv">CSV row</option>
            <option value="javascript">JavaScript strings</option>
            <option value="query">URL query values</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-group-title">Output</span>
          <div class="control-row">
            <label class="field-label" for="delimiter">Delimiter</label>
            <select id="delimiter">
              <option value=",">Comma</option>
              <option value=";">Semicolon</option>
              <option value="|">Pipe</option>
              <option value=" ">Space</option>
              <option value="\t">Tab</option>
              <option value="\n">New line</option>
              <option value="custom">Custom</option>
            </select>
            <input id="customDelimiter" class="compact-input hidden" type="text" maxlength="20" aria-label="Custom delimiter" placeholder="Custom">

            <label class="field-label" for="quoteStyle">Wrap</label>
            <select id="quoteStyle">
              <option value="none">No quotes</option>
              <option value="single">Single quotes</option>
              <option value="double">Double quotes</option>
              <option value="brackets">Brackets</option>
            </select>
          </div>
        </div>

        <div class="control-group affix-group">
          <span class="control-group-title">Around list</span>
          <div class="control-row">
            <label class="field-label" for="prefix">Prefix</label>
            <input id="prefix" class="text-input" type="text" maxlength="80" placeholder="IN (">
            <label class="field-label" for="suffix">Suffix</label>
            <input id="suffix" class="text-input" type="text" maxlength="80" placeholder=")">
          </div>
        </div>

        <fieldset class="control-group cleanup-group">
          <legend class="control-group-title">Cleanup</legend>
          <div class="control-row">
            <label class="checkbox-control" for="trimValues">
              <input id="trimValues" type="checkbox" checked>
              <span>Trim</span>
            </label>
            <label class="checkbox-control" for="removeBlanks">
              <input id="removeBlanks" type="checkbox" checked>
              <span>Remove blanks</span>
            </label>
            <label class="checkbox-control" for="removeDuplicates">
              <input id="removeDuplicates" type="checkbox">
              <span>Remove duplicates</span>
            </label>
            <label class="checkbox-control" for="sortValues">
              <input id="sortValues" type="checkbox">
              <span>Sort</span>
            </label>
          </div>
        </fieldset>
      </section>

      <section class="status-row" aria-live="polite">
        <div id="status" class="status-pill status-valid">Ready</div>
        <div id="stats" class="stats">0 values</div>
      </section>

      <section class="editor-grid" aria-label="List editors">
        <div class="editor-pane">
          <div class="pane-header">
            <label for="sourceInput">Values</label>
            <div class="pane-meta">
              <label class="field-label" for="inputSeparator">Split on</label>
              <select id="inputSeparator" class="small-select">
                <option value="auto">Auto</option>
                <option value="line">New lines</option>
                <option value="comma">Commas</option>
                <option value="semicolon">Semicolons</option>
                <option value="tab">Tabs</option>
                <option value="pipe">Pipes</option>
                <option value="custom">Custom</option>
              </select>
              <input id="customInputSeparator" class="compact-input hidden" type="text" maxlength="20" aria-label="Custom input separator" placeholder="Custom">
              <span id="inputCount">0 values</span>
            </div>
          </div>
          <textarea id="sourceInput" spellcheck="false" aria-label="Input values" placeholder="One value per line">10042
10018
O'Brien
10042

10075</textarea>
        </div>

        <div class="editor-pane">
          <div class="pane-header">
            <label for="formattedOutput">Delimited output</label>
            <span id="outputCount">0 chars</span>
          </div>
          <textarea id="formattedOutput" spellcheck="false" readonly aria-label="Delimited output" placeholder="Delimited output will appear here"></textarea>
        </div>
      </section>

      <footer class="app-footer">
        <span>Runs locally in your browser.</span>
        <span>
          <a href="https://www.davidbreyer.com/tools/terms/">Terms/Privacy</a>
          <a href="https://github.com/davidbreyer/delim-lizard" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span id="releaseStamp" data-version>Version: 20260709-1801</span>
        </span>
      </footer>
    </main>

    <script src="/tools/lizard-tools.js?v=20260709-1801"></script>
    <script src="script.js?v=20260709-1801"></script>
  </body>
</html>
